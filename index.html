<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lovira — AI lan tỏa sự thấu hiểu</title>
    <meta name="description" content="Lovira giúp bạn nhìn, nghe và hiểu thông tin theo cách phù hợp nhất bằng AI trợ năng." />
    <meta property="og:title" content="Lovira — AI lan tỏa sự thấu hiểu" />
    <meta property="og:description" content="Nền tảng trợ năng AI nhân văn hỗ trợ người khuyết tật và mọi người tiếp cận thông tin bình đẳng." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Web App Manifest & PWA Tags -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#3546b5" />

    <!-- Register Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('Service Worker registered successfully:', reg.scope))
            .catch((err) => console.error('Service Worker registration failed:', err));
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
